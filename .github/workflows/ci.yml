name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run types
      # tests/setup.ts forces a fake CLI, including version/help checks. No inference.
      - run: npm test
      # Explicit model-free MCP/transport tests; manual provider probes are excluded.
      - run: node --test probes/approval-mcp.test.mjs probes/echo.test.mjs
      # Fake DAP/process regressions only; no real adapters or scratch installation.
      - run: node --test probes/debug-*.test.mjs
      - run: npm run build
      - run: npm run format:check
